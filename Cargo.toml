[package]
name = "napi-windows-process-start-time"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "A tiny no_std Node-API addon for Windows process creation times"
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"
