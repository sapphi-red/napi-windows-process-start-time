name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Check the release tag matches package.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG must match package.json version v$version" >&2
            exit 1
          fi

  build:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      skip-preview: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: artifacts
      - name: Publish the tested tarball
        env:
          NPM_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        run: npm publish ./artifacts/*.tgz --access public --provenance --ignore-scripts --tag "$NPM_TAG"
