name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Select stable Rust
        run: rustup default stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
        node: [20, 22, 24, 26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Select stable Rust
        run: rustup default stable
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: native-${{ matrix.runner }}
          path: native/*.node
          if-no-files-found: error

  package:
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: native
      - run: pnpm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: '*.tgz'
          if-no-files-found: error

  preview:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts
      - name: Publish preview
        run: pnpm exec pkg-pr-new publish --no-compact --no-template --packageManager=pnpm './artifacts/*.tgz'
